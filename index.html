<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e7" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="ClassFlow" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="9HOXaPlvF3RJAOyAHT26XgSI6bmZ-_sJ0dFD9TVMkik" />
    <meta name="keywords" content="ClassFlow, ClassFlow GPD, Class Flow, class-flow-gpd, campus academic hub, college notes sharing, assignments, student community" />
    <link rel="canonical" href="https://class-flow-gpd.vercel.app/" />
    <meta name="description" content="ClassFlow GPD is a campus academic hub to share, find and preview class notes, assignments, study resources and campus connections." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClassFlow" />
    <meta property="og:url" content="https://class-flow-gpd.vercel.app/" />
    <meta property="og:title" content="ClassFlow — Academic Hub" />
    <meta property="og:description" content="Class resources and campus connections, kept close in one calm academic hub." />
    <meta property="og:image" content="https://class-flow-gpd.vercel.app/classflow-mark.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@classflow" />
    <meta name="twitter:title" content="ClassFlow — Academic Hub" />
    <meta name="twitter:description" content="Class resources and campus connections, kept close in one calm academic hub." />
    <meta name="twitter:image" content="https://class-flow-gpd.vercel.app/classflow-mark.png" />
    
    <!-- Mobile & Favicons (Google Search crawler optimized) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/classflow-mark.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />
    
    <title>ClassFlow — Academic Hub</title>
    
    <!-- Structured Data for Google & AI Overview -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ClassFlow",
      "alternateName": ["ClassFlow GPD", "ClassFlow Academic Hub", "class-flow-gpd"],
      "url": "https://class-flow-gpd.vercel.app/",
      "description": "ClassFlow GPD is a campus academic hub where college students share, find and preview class notes, assignments and study resources.",
      "publisher": {
        "@type": "Organization",
        "name": "ClassFlow GPD",
        "logo": {
          "@type": "ImageObject",
          "url": "https://class-flow-gpd.vercel.app/classflow-mark.png"
        }
      }
    }
    </script>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d16;
        color: #f1f5f9;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 99999;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) #app-loader {
          background: #f5f1e9;
          color: #40372f;
        }
      }
      .app-loader-icon {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        animation: loaderPulse 0.5s ease-in-out forwards;
      }
      .app-loader-title {
        margin-top: 16px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.4px;
        opacity: 0.95;
      }
      .app-loader-bar {
        width: 130px;
        height: 3px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
        margin-top: 14px;
        overflow: hidden;
        position: relative;
      }
      .app-loader-progress {
        position: absolute;
        height: 100%;
        width: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        transform: translateX(-100%);
        animation: loaderSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes loaderPulse {
        0% { transform: scale(0.94); opacity: 0.85; }
        50% { transform: scale(1.03); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes loaderSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(0%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <img src="/classflow-mark.webp" alt="ClassFlow" class="app-loader-icon" />
        <div class="app-loader-title">ClassFlow</div>
        <div class="app-loader-bar">
          <div class="app-loader-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            setInterval(function() { reg.update(); }, 60000);
          }).catch(function() {});
        });
      }
    </script>
  </body>
</html>
